<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TrustPay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: #fff7ed;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        background: #fff7ed;
      }
      /* Static splash — shows before React loads */
      #static-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #fff7ed 0%, #ffffff 45%, #eff6ff 100%);
        transition: opacity 0.5s ease;
      }
      #static-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #static-splash img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 22px;
        filter: drop-shadow(0 8px 24px rgba(234,88,12,0.22));
      }
      #static-splash h1 {
        color: #0f172a;
        font-size: 32px;
        font-weight: 800;
        margin: 16px 0 4px;
        letter-spacing: -0.5px;
        font-family: Inter, system-ui, sans-serif;
      }
      #static-splash p {
        color: #f97316;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0 0 36px;
      }
      .splash-dots {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .splash-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f97316, #ea580c);
        box-shadow: 0 0 8px rgba(249,115,22,0.55);
        animation: sdotBounce 1.1s ease-in-out infinite;
      }
      .splash-dot:nth-child(2) { animation-delay: 0.18s; }
      .splash-dot:nth-child(3) { animation-delay: 0.36s; }
      @keyframes sdotBounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%           { transform: translateY(-10px); opacity: 1; }
      }
      #static-splash-bottom {
        position: absolute;
        bottom: 32px;
        color: rgba(148,163,184,0.8);
        font-size: 10px;
        letter-spacing: 2.5px;
        font-weight: 600;
        text-transform: uppercase;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Static splash: visible before React mounts, prevents FOUC -->
    <div id="static-splash">
      <img src="/trustpay-logo.png" alt="TrustPay" />
      <h1>TrustPay</h1>
      <p>Secure P2P UPI Trading</p>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
      <div id="static-splash-bottom">Powered by TrustPay</div>
    </div>

    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__pwaPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
